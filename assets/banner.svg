<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .signature-path {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: sign 4s ease-in-out infinite alternate;
      }
      .pulse-orb {
        animation: float 6s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: floatReverse 8s ease-in-out infinite alternate;
      }
      .float-card {
        animation: cardFloat 5s ease-in-out infinite alternate;
      }
      .radar-sweep {
        transform-origin: 1040px 140px;
        animation: rotateSweep 10s linear infinite;
      }

      @keyframes sign {
        0% { stroke-dashoffset: 400; opacity: 0.3; }
        40% { stroke-dashoffset: 0; opacity: 1; }
        80% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(-30px) scale(1.15); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) scale(1); }
        100% { transform: translateY(25px) scale(0.9); }
      }
      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g opacity="0.6">
    <circle class="pulse-orb" cx="200" cy="80" r="130" fill="#38bdf8" filter="url(#glowFilter)" opacity="0.25" />
    <circle class="pulse-orb-2" cx="1020" cy="180" r="160" fill="#818cf8" filter="url(#glowFilter)" opacity="0.3" />
    <circle class="pulse-orb" cx="620" cy="380" r="120" fill="#c084fc" filter="url(#glowFilter)" opacity="0.2" />
  </g>

  <!-- Interactive / Dynamic Right Graphic Accent (Simulated Digital Contract & Cryptographic Seal) -->
  <g class="float-card">
    <!-- Contract Container -->
    <rect x="910" y="65" width="230" height="290" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" stroke-opacity="0.6" backdrop-filter="blur(10px)" />
    
    <!-- Mini Header Bar -->
    <rect x="930" y="90" width="80" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="1115" cy="94" r="5" fill="#10b981" />

    <!-- Contract Placeholder Text Lines -->
    <rect x="930" y="115" width="190" height="5" rx="2.5" fill="#64748b" opacity="0.4" />
    <rect x="930" y="130" width="160" height="5" rx="2.5" fill="#64748b" opacity="0.4" />
    <rect x="930" y="145" width="175" height="5" rx="2.5" fill="#64748b" opacity="0.4" />
    <rect x="930" y="160" width="130" height="5" rx="2.5" fill="#64748b" opacity="0.4" />

    <!-- Dynamic Cryptographic Key Stamp / Seal -->
    <g transform="translate(930, 185)">
      <rect width="190" height="48" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" opacity="0.8" />
      <circle cx="25" cy="24" r="12" fill="#0284c7" opacity="0.3" />
      <!-- Lock Icon inside Seal -->
      <path d="M 22 20 L 22 17 C 22 15 28 15 28 17 L 28 20 M 19 20 L 31 20 C 32 20 32 28 31 28 L 19 28 C 18 28 18 20 19 20 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">SHA-256 SEALED</text>
      <text x="45" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">RFC 3161 Timestamped</text>
    </g>

    <!-- Animated Signature Box & Vector Path -->
    <rect x="930" y="250" width="190" height="75" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <text x="942" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#818cf8">✍ Signer Verification</text>
    <!-- Dynamic Animated Signature Stroke -->
    <path class="signature-path" d="M 945 305 Q 965 275 985 300 T 1025 280 T 1060 305 T 1095 285" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Foreground Title and Core Content (Unobstructed & Clean) -->
  <g transform="translate(80, 0)">
    <!-- Decorative Category Tag -->
    <g transform="translate(0, 75)">
      <rect width="210" height="28" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Heading Title -->
    <text x="0" y="155" class="title-text">
      Awesome Electronic Signature
    </text>
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="36" fill="url(#primaryGrad)" letter-spacing="-0.5px">
      Software &amp; Infrastructure
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="246" class="subtitle-text">
      Curated SaaS platforms, self-hosted signing engines, and cryptographic audit workflows.
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1: E-Signatures -->
      <g transform="translate(0, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⚡ Legally Binding</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(162, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🔓 Open Source</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(324, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🛡️ PAdES / eIDAS</text>
      </g>

      <!-- Pill 4: Audit Trails -->
      <g transform="translate(486, 0)">
        <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📜 Tamper-Proof Audit</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
